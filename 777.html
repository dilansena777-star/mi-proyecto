<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{url_for('static', filename='css/pagina1')}}">
    <title>Login Citas</title>
    <style>
body {
    display: flex;
}

.login-container {
    background-color: #fff;
    padding: 20px;
    border-radius: 8px;
    width: 350px;
    text-align: center;
    background-color: rgba(209, 201, 201, 0.8);
}

.input-group {
    margin-bottom: 15px;
}

label {
    display: block;
    margin-bottom: 5px;
    font-size: 14px;
}

input[type="text"],
input[type="documento"],
input[type="password"] {
    width: 90%;
    padding: 9px;
    border: 2px solid #ccc;
    border-radius: 40px;
}

button {
    width: 85%;
    padding: 10px;
    background-color: #45a049;
    color: rgb(231, 224, 224);
    border: none;
    border-radius: 40px;
    
}

button:hover {
    background-color: #0edb18;
}

body {
    font-family: Arial, sans-serif;
    background-image: url('imagenes1/images.jpg'); 
    background-size: cover; 
    justify-content: center;
    align-items: center;
    height: 90vh; 
}

.menu-item a {
    text-decoration: none;
    color: white;
    background-color: #4CAF50;
    padding: 10px 15px;
    border-radius: 15px;
    display: inline-block;
    margin-top: 15px;
}

    </style>
</head>

<body>
    <center>
        <div class="login-container">
            <h2>INICIAR SESION</h2>
            <h2>DIGITURNOS</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Correo Electronico </label>
                    <input type="text" id="username" name="username" required>
                </div>



                <div class="input-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="input-group">
                    <label for="documento">Documento de Indentidad:</label>
                    <input type="documento" id="documento" name="documento" required maxlength="10">
                </div>

            <div class="menu-item">
                <a href="{{url_for('pagina2')}}">Iniciar Sesion</a>
            </div>
        
        </form>

        </div>
    </center>
</body>
</html>
