<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú ITIP</title>
    <style>
        body {
             margin: 0;
             font-family: Arial, sans-serif;

        }

        header {
             background-color: #4CAF50; 
             color: rgb(255, 255, 255);
             padding: 30px ;
             text-align: center;
             font-size: 24px;
             font-weight: bold;
        }

        .menu-container {
             display: flex;
             justify-content: center;
             align-items: center;
             margin: 120px;
        }
        
        .menu-item {
             background-color: #ffffffaf;
             border: 2px solid #4CAF50;
             border-radius: 10px;
             width: 210px;
             text-align: center;
             padding: 25px;
             
        }


        .menu-item h3 {
             margin: 10px 0;
             font-size: 18px;
             color: #333;
        }

        .menu-item a {
             text-decoration: none;
             color: white;
             background-color: #4CAF50;
             padding: 10px 15px;
             border-radius: 15px;
             display: inline-block;
             margin-top: 15px;
        }


        footer {
             text-align: center;
             padding: 10px;
             background-color: #4CAF50;
             color: white;
             position: fixed;
             bottom: 0;
             width: 100%;
        }

        body {
             font-family: Arial, sans-serif;
             background-image: url('/images.png'); 
             background-size: cover; 
             justify-content: center;
             align-items: center;
       }
    </style>
</head>
<body>
    <header>
        Menú Principal ITIP
    </header>

    <div class="menu-container">
        <div class="menu-item">
          Muchas gracias!!
          

    </div>

    <footer>
        &copy; 2025 Instituto Tecnico Industrial Piloto.
    </footer>

</body>
</html>
